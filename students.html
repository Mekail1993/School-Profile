<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>শিক্ষার্থী</title><link rel="stylesheet" href="styles.css" /></head><body>
<header><h1>বাংলাদেশ প্রাথমিক বিদ্যালয় পোর্টাল</h1><p>শিক্ষার্থী এন্ট্রি</p></header>
<nav class="menu-bar"><a href="index.html">ড্যাশবোর্ড</a><a href="school-profile.html">স্কুল প্রোফাইল</a><a href="teachers.html">শিক্ষক</a><a href="configure.html">সেটিংস</a><a href="students.html">শিক্ষার্থী এন্ট্রি</a><a href="marks.html">নম্বর এন্ট্রি</a><a href="documents.html">ডকুমেন্টস</a></nav>
<main>
<section class="card"><h2>শিক্ষার্থী এন্ট্রি</h2><form id="studentForm"><div class="grid"><label>ইউজার আইডি <input required name="id" /></label><label>পূর্ণ নাম <input required name="name" /></label><label>রোল নম্বর <input required type="number" min="1" name="roll" /></label><label>শ্রেণি<select name="className"><option>Class 1</option><option>Class 2</option><option>Class 3</option><option>Class 4</option><option>Class 5</option></select></label><label>শাখা <input name="section" /></label><label>অভিভাবকের নাম <input name="guardian" /></label><label>মোবাইল <input name="mobile" /></label><label>জন্ম তারিখ <input type="date" name="dob" /></label></div><button type="submit">শিক্ষার্থী সংরক্ষণ</button></form></section>
<section class="card"><h2>শিক্ষার্থী তালিকা</h2><div class="toolbar"><label>শিক্ষার্থী নির্বাচন<select id="studentSelector"></select></label><button id="deleteBtn" class="danger">নির্বাচিতটি মুছুন</button></div><div class="table-wrap"><table><thead><tr><th>ইউজার আইডি</th><th>নাম</th><th>শ্রেণি</th><th>শাখা</th><th>রোল</th><th>নম্বর</th></tr></thead><tbody id="studentTableBody"></tbody></table></div></section>
</main>
<script src="documentGenerators.js"></script><script src="app.js"></script></body></html>
