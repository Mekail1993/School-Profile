</head>

<body>

<header>
<h1>বাংলাদেশ প্রাথমিক বিদ্যালয় পোর্টাল</h1>
<p>নম্বর এন্ট্রি</p>
</header>

<nav class="menu-bar">
<a href="index.html">ড্যাশবোর্ড</a>
<a href="school-profile.html">স্কুল প্রোফাইল</a>

<a href="documents.html">ডকুমেন্টস</a>
</nav>

<main>

<section class="card">
<h2>শ্রেণিভিত্তিক নম্বর এন্ট্রি</h2>

<div class="grid">

<label>
শ্রেণি নির্বাচন করুন
<select id="classSelect">
<option value="">নির্বাচন করুন</option>
<option value="প্রাক-প্রাথমিক">প্রাক-প্রাথমিক</option>
<option value="১ম শ্রেণি">১ম শ্রেণি</option>
<option value="২য় শ্রেণি">২য় শ্রেণি</option>
<option value="৩য় শ্রেণি">৩য় শ্রেণি</option>
<option value="৪র্থ শ্রেণি">৪র্থ শ্রেণি</option>
<option value="৫ম শ্রেণি">৫ম শ্রেণি</option>
</select>
</label>

<label>
পরীক্ষা
<select id="examName">
<option>প্রথম সাময়িক</option>
<option>অর্ধবার্ষিক</option>
<option>বার্ষিক</option>
</select>
</label>

</div>

</section>

<section class="card" id="marksSection" style="display:none;">
<h2 id="classTitle">নম্বর এন্ট্রি</h2>

<form id="marksForm">

<div id="studentMarksArea"></div>

<div class="doc-buttons">
<button type="submit">সব নম্বর সংরক্ষণ</button>
</div>

</form>

</section>

</main>

<script>
const classSelect = document.getElementById("classSelect");
const marksSection = document.getElementById("marksSection");
const studentMarksArea = document.getElementById("studentMarksArea");
const classTitle = document.getElementById("classTitle");

function getStudents(){
return JSON.parse(localStorage.getItem("students")) || [];
}

classSelect.addEventListener("change", function(){

const selectedClass = this.value;
studentMarksArea.innerHTML = "";

if(selectedClass === ""){
marksSection.style.display = "none";
return;
}

const allStudents = getStudents();

const classStudents = allStudents.filter(student => student.className === selectedClass);

classTitle.innerText = selectedClass + " - নম্বর এন্ট্রি";

if(classStudents.length === 0){
studentMarksArea.innerHTML = "<p>এই শ্রেণিতে কোনো শিক্ষার্থী পাওয়া যায়নি</p>";
marksSection.style.display = "block";
return;
}

classStudents.forEach(student => {

studentMarksArea.innerHTML += `
<div class="card" style="margin-bottom:15px;">
<h3>${student.roll} - ${student.name}</h3>

<div class="grid">

<label>বাংলা
<input type="number" min="0" max="100" name="bangla_${student.id}">
</label>

<label>ইংরেজি
<input type="number" min="0" max="100" name="english_${student.id}">
</label>

<label>গণিত
<input type="number" min="0" max="100" name="math_${student.id}">
</label>

<label>বিজ্ঞান
<input type="number" min="0" max="100" name="science_${student.id}">
</label>

<label>ধর্ম
<input type="number" min="0" max="100" name="religion_${student.id}">
</label>

</div>
</div>
`;

});

marksSection.style.display = "block";

});

document.getElementById("marksForm").addEventListener("submit", function(e){
e.preventDefault();

const selectedClass = classSelect.value;
const examName = document.getElementById("examName").value;

const students = getStudents();
const classStudents = students.filter(student => student.className === selectedClass);

let savedMarks = JSON.parse(localStorage.getItem("marks")) || [];

classStudents.forEach(student => {

const markData = {
studentId: student.id,
name: student.name,
roll: student.roll,
className: selectedClass,
exam: examName,
bangla: document.querySelector(`[name="bangla_${student.id}"]`).value || 0,
english: document.querySelector(`[name="english_${student.id}"]`).value || 0,
math: document.querySelector(`[name="math_${student.id}"]`).value || 0,
science: document.querySelector(`[name="science_${student.id}"]`).value || 0,
religion: document.querySelector(`[name="religion_${student.id}"]`).value || 0
};

savedMarks.push(markData);

});

localStorage.setItem("marks", JSON.stringify(savedMarks));

alert("নম্বর সফলভাবে সংরক্ষণ করা হয়েছে");

});
</script>

<script src="documentGenerators.js"></script>
<script src="app.js"></script>

</body>
</html>
