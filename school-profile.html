<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>স্কুল প্রোফাইল</title>
<link rel="stylesheet" href="styles.css" />
</head>

<body>

<header>
    <h1>বাংলাদেশ প্রাথমিক বিদ্যালয় পোর্টাল</h1>
    <p>স্কুল প্রোফাইল</p>
</header>

<nav class="menu-bar">
    <a href="index.html">ড্যাশবোর্ড</a>
    <a href="school-profile.html">স্কুল প্রোফাইল</a>
    <a href="teachers.html">শিক্ষক</a>
    <a href="configure.html">সেটিংস</a>
    <a href="students.html">শিক্ষার্থী এন্ট্রি</a>
    <a href="marks.html">নম্বর এন্ট্রি</a>
    <a href="class-routine.html">ক্লাস রুটিন</a>
    <a href="leave-management.html">ছুটি ব্যবস্থাপনা</a>
    <a href="official-pad.html">অফিসিয়াল প্যাড</a>
    <a href="documents.html">ডকুমেন্টস</a>
</nav>

<main>

<section class="card">
<h2>স্কুল প্রোফাইল</h2>

<form id="schoolProfileForm" class="grid">

<label>
বিদ্যালয়ের নাম
<input id="schoolName" name="schoolName" />
</label>

<label>
EIIN / স্কুল কোড
<input id="schoolCode" name="schoolCode" />
</label>

<label>
প্রতিষ্ঠার সাল
<input id="establishedYear" name="establishedYear" />
</label>

<label>
বিদ্যালয়ের ধরন
<select id="schoolType" name="schoolType">
<option>সরকারি</option>
<option>বেসরকারি</option>
</select>
</label>

<label>
শিফট
<select id="shiftType" name="shiftType">
<option>এক শিফট</option>
<option>দুই শিফট</option>
</select>
</label>

<label>
পূর্ণ ঠিকানা
<input id="schoolAddress" name="schoolAddress" />
</label>

<label>
জেলা
<input id="district" name="district" />
</label>

<label>
উপজেলা
<input id="upazila" name="upazila" />
</label>

<label>
ইউনিয়ন
<input id="union" name="union" />
</label>

<label>
যোগাযোগ নম্বর
<input id="schoolPhone" name="schoolPhone" />
</label>

<label>
ইমেইল
<input id="schoolEmail" name="schoolEmail" />
</label>

<label>
ওয়েবসাইট
<input id="schoolWebsite" name="schoolWebsite" />
</label>

<label>
প্রধান শিক্ষক
<input id="headTeacher" name="headTeacher" />
</label>

<label>
সহকারী শিক্ষক সংখ্যা
<input id="assistantTeacherCount" name="assistantTeacherCount" type="number" />
</label>

<label>
মোট শিক্ষার্থী
<input id="totalStudents" name="totalStudents" type="number" />
</label>

<label>
ছাত্র সংখ্যা
<input id="maleStudents" name="maleStudents" type="number" />
</label>

<label>
ছাত্রী সংখ্যা
<input id="femaleStudents" name="femaleStudents" type="number" />
</label>

<label>
মোট শ্রেণিকক্ষ
<input id="totalRooms" name="totalRooms" type="number" />
</label>

<label>
ব্যবহারযোগ্য শ্রেণিকক্ষ
<input id="usableRooms" name="usableRooms" type="number" />
</label>

<label>
টয়লেট সংখ্যা
<input id="toiletCount" name="toiletCount" type="number" />
</label>

<label>
পানির ব্যবস্থা
<input id="waterSource" name="waterSource" />
</label>

<label>
বিদ্যুৎ সুবিধা
<select id="electricity" name="electricity">
<option>আছে</option>
<option>নেই</option>
</select>
</label>

<label>
কম্পিউটার সংখ্যা
<input id="computerCount" name="computerCount" type="number" />
</label>

<label>
লাইব্রেরি
<select id="libraryStatus" name="libraryStatus">
<option>আছে</option>
<option>নেই</option>
</select>
</label>

<label>
খেলার মাঠ
<select id="playgroundStatus" name="playgroundStatus">
<option>আছে</option>
<option>নেই</option>
</select>
</label>

<label>
গত বছরের পাশের হার (%)
<input id="passRate" name="passRate" />
</label>

<label>
উপস্থিতির হার (%)
<input id="attendanceRate" name="attendanceRate" />
</label>

<label>
ফেসবুক পেজ
<input id="facebookPage" name="facebookPage" />
</label>

<label>
গুগল ম্যাপ লিংক
<input id="mapLink" name="mapLink" />
</label>

<label>
বিদ্যালয়ের লোগো
<input id="schoolLogo" name="schoolLogo" type="file" />
</label>

<label>
বিদ্যালয়ের ছবি
<input id="schoolImage" name="schoolImage" type="file" />
</label>

<button type="submit">স্কুল প্রোফাইল সংরক্ষণ</button>

</form>
</section>

</main>

<script src="documentGenerators.js"></script>
<script src="app.js"></script>

</body>
</html>
