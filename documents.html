<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
<h1>বাংলাদেশ প্রাথমিক বিদ্যালয় পোর্টাল</h1>
<p>ডকুমেন্ট সেন্টার</p>
</header>

<!-- ================= MENU (GLOBAL CSS CONTROLLED) ================= -->
<nav class="menu-bar">
<a href="index.html">ড্যাশবোর্ড</a>
<a href="school-profile.html">স্কুল প্রোফাইল</a>
<a href="teachers.html">শিক্ষক</a>
<a href="students.html">শিক্ষার্থী এন্ট্রি</a>
<a href="marks.html">নম্বর এন্ট্রি</a>
<a href="class-routine.html">ক্লাস রুটিন</a>

<a href="official-pad.html">অফিসিয়াল প্যাড</a>
<a href="documents.html">ডকুমেন্টস</a>
</nav>

<main>

<section class="card docs">

<h2>ডকুমেন্ট সেন্টার</h2>

<!-- ================= CONTROLS ================= -->
<div class="grid">

<label>
স্কুলের নাম
<input id="optSchoolName" value="বাংলাদেশ প্রাথমিক বিদ্যালয়">
</label>

<label>
পরীক্ষা
<select id="optExamName"></select>
</label>

<label>
শিক্ষার্থী
<select id="studentSelector"></select>
</label>

</div>

<!-- ================= ACTION BUTTONS ================= -->
<div class="doc-buttons">
<button data-doc="tabulation">ট্যাবুলেশন শিট</button>
<button data-doc="marksheet">মার্কশিট</button>
</div>

<!-- ================= OUTPUT ================= -->
<article id="documentOutput" class="output"></article>

</section>

</main>

<script>
// ================= DATA LOAD =================
const students = JSON.parse(localStorage.getItem("students")) || [];
const marks = JSON.parse(localStorage.getItem("marks")) || [];

// ================= DOM =================
const studentSelector = document.getElementById("studentSelector");
const examSelect = document.getElementById("optExamName");
const output = document.getElementById("documentOutput");

// ================= SUBJECT SYSTEM (FINAL STANDARD) =================
const SUBJECTS = ["bangla","english","math","science","bgs","religion"];

const SUBJECT_LABELS = {
  bangla: "বাংলা",
  english: "ইংরেজি",
  math: "গণিত",
  science: "বিজ্ঞান",
  bgs: "বাওবি",
  religion: "ধর্ম"
};

// ================= LOAD STUDENTS =================
students.forEach(s => {
  const opt = document.createElement("option");
  opt.value = s.id;
  opt.textContent = `${s.name} (${s.className})`;
  studentSelector.appendChild(opt);
});

// ================= LOAD EXAMS =================
const examList = [...new Set(marks.map(m => m.exam))];

examSelect.innerHTML = `
<option value="প্রথম সাময়িক">প্রথম সাময়িক</option>
<option value="অর্ধবার্ষিক">অর্ধবার্ষিক</option>
<option value="বার্ষিক">বার্ষিক</option>
${examList.map(e => `<option value="${e}">${e}</option>`).join('')}
`;

// ================= HELPERS =================
function getStudent(){
  return students.find(s => s.id == studentSelector.value);
}

function getMarks(studentId, exam){
  return marks.find(m => m.studentId == studentId && m.exam == exam) || {};
}

// ================= GPA SYSTEM =================
function gradePoint(mark){
  if(mark >= 80) return 5;
  if(mark >= 70) return 4;
  if(mark >= 60) return 3.5;
  if(mark >= 50) return 3;
  if(mark >= 40) return 2;
  if(mark >= 33) return 1;
  return 0;
}

function calculate(data){
  const values = SUBJECTS.map(s => Number(data[s] || 0));

  const total = values.reduce((a,b)=>a+b,0);

  const gpa = (values.reduce((sum,m)=>sum+gradePoint(m),0)/SUBJECTS.length).toFixed(2);

  const status = values.every(m => m >= 33) ? "Pass" : "Fail";

  return { total, gpa, status };
}

// ================= EVENT =================
document.querySelectorAll("[data-doc]").forEach(btn => {

  btn.addEventListener("click", () => {

    const type = btn.dataset.doc;
    const student = getStudent();
    const exam = examSelect.value;

    if(!student){
      alert("শিক্ষার্থী নির্বাচন করুন");
      return;
    }

    const data = {
      ...student,
      ...getMarks(student.id, exam)
    };

    let html = "";

    // ================= TABULATION =================
    if(type === "tabulation"){

      const rows = marks
        .filter(m => m.exam === exam)
        .map(m => {

          const res = calculate(m);

          return `
            <tr>
              <td>${m.studentId}</td>
              <td>${m.name}</td>
              <td>${m.className}</td>

              ${SUBJECTS.map(s => `<td>${m[s] || 0}</td>`).join('')}

              <td>${res.total}</td>
              <td>${res.gpa}</td>
              <td>${res.status}</td>
            </tr>
          `;
        }).join('');

      html = `
        <div class="doc-sheet">
          <h3>ট্যাবুলেশন শিট</h3>

          <table>
            <tr>
              <th>ID</th>
              <th>নাম</th>
              <th>শ্রেণি</th>

              ${SUBJECTS.map(s => `<th>${SUBJECT_LABELS[s]}</th>`).join('')}

              <th>মোট</th>
              <th>GPA</th>
              <th>ফলাফল</th>
            </tr>

            ${rows}
          </table>
        </div>
      `;
    }

    // ================= MARKSHEET =================
    if(type === "marksheet"){

      const res = calculate(data);

      html = `
        <div class="doc-sheet">
          <h3>মার্কশিট</h3>

          <p><strong>নাম:</strong> ${data.name}</p>
          <p><strong>শ্রেণি:</strong> ${data.className}</p>

          <table>
            <tr>
              <th>বিষয়</th>
              <th>নম্বর</th>
              <th>গ্রেড</th>
            </tr>

            ${SUBJECTS.map(s => `
              <tr>
                <td>${SUBJECT_LABELS[s]}</td>
                <td>${data[s] || 0}</td>
                <td>${gradePoint(data[s] || 0)}</td>
              </tr>
            `).join('')}
          </table>

          <p><strong>মোট:</strong> ${res.total}</p>
          <p><strong>GPA:</strong> ${res.gpa}</p>
          <p><strong>ফলাফল:</strong> ${res.status}</p>
        </div>
      `;
    }

    output.innerHTML = html;

  });

});
</script>

</body>
</html>
